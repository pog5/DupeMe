architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java.srcDir(rootProject.file("common/src/main/java"))
        resources.srcDir(rootProject.file("common/src/main/resources"))
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

processResources {
    def props = [version: project.version, minecraft: rootProject.minecraft_version,
                 java: rootProject.java_version, fabric_loader_version: rootProject.fabric_loader_version]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}
